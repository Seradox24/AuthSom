services:
  db:
    image: ${POSTGRES_IMAGE:?}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${KEYCLOAK_DB_NAME:?}
      POSTGRES_USER: ${KEYCLOAK_DB_USER:?}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?}
    volumes:
      - ${DATA_ROOT:?}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 10s
      timeout: 5s
      retries: 15
  keycloak:
    image: ${KEYCLOAK_IMAGE:?}
    restart: unless-stopped
    command: [start, --import-realm]
    depends_on:
      db:
        condition: service_healthy
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: db
      KC_DB_URL_DATABASE: ${KEYCLOAK_DB_NAME:?}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER:?}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?}
      KC_HOSTNAME: ${KEYCLOAK_HOSTNAME:?}
      KC_HTTP_ENABLED: 'true'
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: 'true'
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-}
      JAVA_OPTS_KC_HEAP: '-Xms256m -Xmx1024m'
    ports:
      - '127.0.0.1:${KEYCLOAK_HTTP_PORT:?}:8080'
    volumes:
      - ${CONFIG_ROOT:?}/import:/opt/keycloak/data/import:ro
    healthcheck:
      test: [CMD, bash, -ec, 'exec 3<>/dev/tcp/127.0.0.1/9000; printf "GET /health/ready HTTP/1.0\r\nHost: localhost\r\n\r\n" >&3; grep -q "HTTP/1.0 200" <&3']
      interval: 15s
      timeout: 5s
      retries: 15
      start_period: 120s
